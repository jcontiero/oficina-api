apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api-worker
  labels:
    app: oficina-api-worker
    tags.datadoghq.com/service: oficina-api-worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: oficina-api-worker
  template:
    metadata:
      labels:
        app: oficina-api-worker
        tags.datadoghq.com/service: oficina-api-worker
    spec:
      serviceAccountName: oficina-api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: us-east1-docker.pkg.dev/fiap-project-514922/oficina-docker/oficina-api:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              export DATABASE_URL=$(cat /mnt/secrets-store/database-url)
              export SECRET_KEY=$(cat /mnt/secrets-store/secret-key)
              export ADMIN_JWT_PRIVATE_KEY_PEM="$(cat /mnt/secrets-store/admin-jwt-private-key-pem)"
              exec python -m src.worker
          envFrom:
            - configMapRef:
                name: oficina-api-config
          env:
            - name: DD_ENV
              valueFrom:
                configMapKeyRef:
                  name: oficina-api-config
                  key: ENVIRONMENT
            - name: DD_SERVICE
              value: "oficina-api-worker"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: "75m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: oficina-api-secrets
