apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api-worker
  labels:
    app: oficina-api-worker
    tags.datadoghq.com/service: oficina-api-worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: oficina-api-worker
  template:
    metadata:
      labels:
        app: oficina-api-worker
        tags.datadoghq.com/service: oficina-api-worker
    spec:
      serviceAccountName: oficina-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: us-east1-docker.pkg.dev/fiap-project-514922/oficina-docker/oficina-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "src.worker"]
          envFrom:
            - configMapRef:
                name: oficina-api-config
            - secretRef:
                name: oficina-api-secret
          env:
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DD_SERVICE
              value: "oficina-api-worker"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: oficina-api-secrets
