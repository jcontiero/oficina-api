apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oficina-api-secrets
spec:
  provider: gke
  secretObjects:
    - secretName: oficina-api-secret
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
        - objectName: secret-key
          key: SECRET_KEY
        - objectName: admin-jwt-private-key-pem
          key: ADMIN_JWT_PRIVATE_KEY_PEM
  parameters:
    secrets: |
      - resourceName: "projects/fiap-project-514922/secrets/oficina-api-database-url-homolog/versions/latest"
        path: "database-url"
      - resourceName: "projects/fiap-project-514922/secrets/oficina-api-secret-key-homolog/versions/latest"
        path: "secret-key"
      - resourceName: "projects/fiap-project-514922/secrets/oficina-api-admin-jwt-private-key-homolog/versions/latest"
        path: "admin-jwt-private-key-pem"
