apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-api-migrate
  labels:
    app: oficina-api
    component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: oficina-api
        component: migration
    spec:
      serviceAccountName: oficina-api-sa
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: us-east1-docker.pkg.dev/fiap-project-514922/oficina-docker/oficina-api:latest
          command:
            - sh
            - -c
            - |
              export DATABASE_URL=$(cat /mnt/secrets-store/database-url)
              export SECRET_KEY=$(cat /mnt/secrets-store/secret-key)
              export ADMIN_JWT_PRIVATE_KEY_PEM=$(cat /mnt/secrets-store/admin-jwt-private-key-pem)
              exec alembic upgrade head
          envFrom:
            - configMapRef:
                name: oficina-api-config
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: oficina-api-secrets
