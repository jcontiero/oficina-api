apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  labels:
    app: oficina-api
    tags.datadoghq.com/service: oficina-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
        tags.datadoghq.com/service: oficina-api
    spec:
      serviceAccountName: oficina-api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: api
          image: us-east1-docker.pkg.dev/fiap-project-514922/oficina-docker/oficina-api:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              export DATABASE_URL=$(cat /mnt/secrets-store/database-url)
              export SECRET_KEY=$(cat /mnt/secrets-store/secret-key)
              export ADMIN_JWT_PRIVATE_KEY_PEM="$(cat /mnt/secrets-store/admin-jwt-private-key-pem)"
              exec uvicorn src.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: oficina-api-config
          env:
            - name: DD_ENV
              valueFrom:
                configMapKeyRef:
                  name: oficina-api-config
                  key: ENVIRONMENT
            - name: DD_SERVICE
              value: "oficina-api"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: oficina-api-secrets
