name: CI/CD Pipeline

on:
  push:
    branches:
      - homolog
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite 'true' para autorizar o build/push/migration/deploy no GKE"
        required: true
        default: "false"

env:
  PYTHON_VERSION: "3.12"
  PROJECT_ID: "fiap-project-514922"
  REGION: "us-east1"
  REPOSITORY: "oficina-docker"
  IMAGE_NAME: "oficina-api"

concurrency:
  group: ci-cd-oficina-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff check
        run: uv run ruff check src tests scripts spikes integration
      - name: Black check
        run: uv run black --check src tests scripts spikes integration
      - name: Pytest (unit + integration) with coverage gate (>=80%)
        run: uv run pytest tests/unit tests/integration --cov=src --cov-fail-under=80 -q
        env:
          DD_TRACE_ENABLED: "false"
          TEST_DATABASE_URL: "sqlite:////tmp/oficina_ci_test.db"
          SECRET_KEY: ci-secret-key-para-testes-32-chars-ok

  bdd-integrado:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oficina-api
        uses: actions/checkout@v4
        with:
          path: oficina-api
      - name: Checkout oficina-billing (SHA P6)
        uses: actions/checkout@v4
        with:
          repository: jcontiero/oficina-billing
          ref: fd8b78bb80c75fe33a95cb9611ffaf7f563f7161
          path: oficina-billing
      - name: Checkout oficina-execucao (SHA P6)
        uses: actions/checkout@v4
        with:
          repository: jcontiero/oficina-execucao
          ref: ee8449de74139258457c15acd29d960fb7832e8e
          path: oficina-execucao
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies (oficina-api)
        working-directory: oficina-api
        run: uv sync --all-extras
      - name: Registrar manifesto de SHAs
        working-directory: oficina-api
        run: |
          mkdir -p integration/relatorios
          cat <<EOF > integration/relatorios/manifesto-shas.json
          {
            "oficina-api": "$(git rev-parse HEAD)",
            "oficina-billing": "$(git -C ../oficina-billing rev-parse HEAD)",
            "oficina-execucao": "$(git -C ../oficina-execucao rev-parse HEAD)"
          }
          EOF
          cat integration/relatorios/manifesto-shas.json
      - name: Subir stack integrada (3 APIs, 3 workers, Postgres, Firestore e Pub/Sub)
        working-directory: oficina-api
        run: docker compose -f integration/compose.yml up -d --build
      - name: Executar BDD integrado (fluxo feliz + compensação/reinício)
        working-directory: oficina-api
        env:
          RUN_LIVE_BDD: "1"
          PYTHONPATH: "."
        run: |
          uv run pytest tests/bdd/test_p6_bdd_integrado.py -v --junitxml=integration/relatorios/bdd-junit.xml
          uv run pytest tests/bdd/test_p6_bdd_integrado.py -v --junitxml=integration/relatorios/bdd-reexecucao-junit.xml
      - name: Coletar logs e encerrar stack
        if: always()
        working-directory: oficina-api
        run: |
          mkdir -p integration/relatorios
          docker compose -f integration/compose.yml logs --no-color > integration/relatorios/docker-compose.log || true
          docker compose -f integration/compose.yml down -v || true
      - name: Publicar relatório, logs e manifesto de SHAs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-integrado-relatorios
          path: oficina-api/integration/relatorios/
          retention-days: 14

  build-push-deploy:
    runs-on: ubuntu-latest
    needs: [validate, bdd-integrado]
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == 'true' && github.ref == 'refs/heads/main'
    environment: homolog
    permissions:
      id-token: write
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify required checks for exact deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" > /tmp/deploy-checks.json
          python - <<'PYTHON'
          import json
          checks = json.load(open('/tmp/deploy-checks.json'))['check_runs']
          required = ['validate', 'SonarCloud Code Analysis', 'bdd-integrado', 'SonarQube']
          for name in required:
              matches = [c for c in checks if c['name'] == name]
              latest = max(matches, key=lambda c: c['id']) if matches else None
              if latest is None or latest['conclusion'] != 'success':
                  raise SystemExit(f'Check obrigatório ausente ou reprovado: {name}')
          print('Checks aprovados para o SHA de deploy')
          PYTHON

      - name: Set homolog metadata
        id: env
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          echo "env_canon=homolog" >> "$GITHUB_OUTPUT"
          echo "k8s_ns=oficina-homolog" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: 'projects/936717667971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@fiap-project-514922.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Docker auth & GKE credentials
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          gcloud container clusters get-credentials oficina-gke-cluster --zone us-east1-b --project ${{ env.PROJECT_ID }}

      - name: Build and push immutable Docker image
        env:
          IMAGE_TAG: ${{ steps.env.outputs.image_tag }}
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Run Coordinated Database Migration & Rollout to K8s
        env:
          ENV_CANON: ${{ steps.env.outputs.env_canon }}
          K8S_NS: ${{ steps.env.outputs.k8s_ns }}
          IMAGE_TAG: ${{ steps.env.outputs.image_tag }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          GW_HOST="$(gcloud api-gateway gateways describe "oficina-gateway-${ENV_CANON}" --location=us-east1 --project="${{ env.PROJECT_ID }}" --format="value(defaultHostname)")"

          kubectl create namespace "${K8S_NS}" --dry-run=client -o yaml | kubectl apply -f -
          if [ "${ENV_CANON}" = "homolog" ]; then
            kubectl apply -f k8s/ingress-homolog.yaml
          fi

          mkdir -p /tmp/rendered-k8s
          cp k8s/*.yaml /tmp/rendered-k8s/

          for f in /tmp/rendered-k8s/*.yaml; do
            sed -i "s|us-east1-docker.pkg.dev/fiap-project-514922/oficina-docker/oficina-api:latest|${IMAGE_URI}|g" "$f"
            sed -i "s|oficina-api-homolog-sa|oficina-api-${ENV_CANON}-sa|g" "$f"
            sed -i "s|oficina-api-database-url-homolog|oficina-api-database-url-${ENV_CANON}|g" "$f"
            sed -i "s|oficina-api-secret-key-homolog|oficina-api-secret-key-${ENV_CANON}|g" "$f"
            sed -i "s|oficina-api-admin-jwt-private-key-homolog|oficina-api-admin-jwt-private-key-${ENV_CANON}|g" "$f"
            sed -i "s|oficina-fn-homolog-sa|oficina-fn-${ENV_CANON}-sa|g" "$f"
            sed -i "s|oficina-backend-homolog|oficina-backend-${ENV_CANON}|g" "$f"
            sed -i "s|oficina-admin-homolog|oficina-admin-${ENV_CANON}|g" "$f"
            sed -i "s|oficina-auth-homolog|oficina-auth-${ENV_CANON}|g" "$f"
            sed -i "s|ENVIRONMENT: \"homolog\"|ENVIRONMENT: \"${ENV_CANON}\"|g" "$f"
            sed -i "s|DD_VERSION: \"latest\"|DD_VERSION: \"${{ steps.env.outputs.image_tag }}\"|g" "$f"
            sed -i "s|GATEWAY_HOST_PLACEHOLDER|${GW_HOST}|g" "$f"
            sed -i 's/value: "latest"/value: "'"${IMAGE_TAG}"'"/g' "$f"
          done

          # 1. Aplicar ServiceAccount, ConfigMap e SecretProviderClass primeiro
          kubectl apply -f /tmp/rendered-k8s/serviceaccount.yaml -n "${K8S_NS}"
          kubectl apply -f /tmp/rendered-k8s/configmap.yaml -n "${K8S_NS}"
          kubectl apply -f /tmp/rendered-k8s/secret-provider-class.yaml -n "${K8S_NS}"

          # 2. Executar Job de migration com imagem do SHA e aguardar conclusão antes dos Deployments
          kubectl delete job oficina-api-migrate -n "${K8S_NS}" --ignore-not-found=true
          kubectl apply -f /tmp/rendered-k8s/job-migrate.yaml -n "${K8S_NS}"
          kubectl wait --for=condition=complete job/oficina-api-migrate -n "${K8S_NS}" --timeout=300s

          # 3. Aplicar Deployments, Service e HPA e aguardar rollout
          kubectl apply -f /tmp/rendered-k8s/service.yaml -n "${K8S_NS}"
          kubectl apply -f /tmp/rendered-k8s/deployment.yaml -n "${K8S_NS}"
          kubectl apply -f /tmp/rendered-k8s/deployment-worker.yaml -n "${K8S_NS}"
          kubectl apply -f /tmp/rendered-k8s/hpa.yaml -n "${K8S_NS}"
          kubectl rollout status deployment/oficina-api -n "${K8S_NS}" --timeout=300s
          kubectl rollout status deployment/oficina-api-worker -n "${K8S_NS}" --timeout=300s

          # 4. Coletor somente leitura apos migrations e rollout
          kubectl create configmap oficina-observabilidade --from-file=exportar_metricas.py=scripts/exportar_metricas.py --dry-run=client -o yaml | kubectl apply -f - -n "${K8S_NS}"
          kubectl apply -f /tmp/rendered-k8s/observabilidade.yaml -n "${K8S_NS}"
