name: CI/CD Pipeline

on:
  push:
    branches:
      - homolog
      - main
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: "3.12"
  PROJECT_ID: "pos-fiap-2026"
  REGION: "us-east1"
  REPOSITORY: "oficina-docker"
  IMAGE_NAME: "oficina-api"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff check
        run: uv run ruff check src tests scripts
      - name: Black check
        run: uv run black --check src tests scripts
      - name: Pytest
        run: uv run pytest tests/unit -q
        env:
          SECRET_KEY: ci-secret-key-para-testes-32-chars-ok

  build-push-deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1064199753061/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@pos-fiap-2026.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          docker build -t $IMAGE_URI:${{ github.sha }} -t $IMAGE_URI:latest .
          docker push $IMAGE_URI:${{ github.sha }}
          docker push $IMAGE_URI:latest

      - name: Get GKE Credentials
        run: gcloud container clusters get-credentials oficina-gke-cluster --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }}

      - name: Deploy to K8s
        env:
          DB_URL_SECRET: ${{ secrets.DB_URL }}
        run: |
          # Usamos namespace baseado na branch
          NAMESPACE=${{ github.ref_name == 'main' && 'production' || 'homolog' }}
          kubectl apply -f k8s/namespace-${{ github.ref_name == 'main' && 'prod' || 'homolog' }}.yaml
          rm -f k8s/namespace-*.yaml
          # Substituir a tag da imagem
          sed -i "s|latest|${{ github.sha }}|g" k8s/deployment.yaml
          sed -i "s|latest|${{ github.sha }}|g" k8s/deployment-worker.yaml
          # Substituir variáveis no secret
          sed -i "s|DB_URL_PLACEHOLDER|${DB_URL_SECRET}|g" k8s/secret.yaml
          
          # Aplicar manifestos
          kubectl apply -f k8s/ -n $NAMESPACE
