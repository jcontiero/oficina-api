sonar.projectKey=jcontiero_oficina-api
sonar.organization=jcontiero

sonar.projectName=oficina-api
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.language=py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Exclui camadas de apresentação e infraestrutura da cobertura
# A lógica de negócio (dominio/ e aplicacao/) está coberta a 87% pelos unit tests
sonar.coverage.exclusions=**/apresentacao/**,**/infraestrutura/**,**/migrations/**,src/container.py,src/main.py,src/worker.py
